<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#080a0c" />
    <meta
      name="description"
      content="Минималистичная браузерная змейка: четыре режима, препятствия и рекорды. Играй без установки."
    />
    <link rel="canonical" href="https://btur99.github.io/snake-game/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:site_name" content="Змейка" />
    <meta property="og:title" content="Змейка — четыре режима" />
    <meta
      property="og:description"
      content="Минималистичная браузерная змейка: четыре режима, препятствия и рекорды. Играй без установки."
    />
    <meta property="og:url" content="https://btur99.github.io/snake-game/" />
    <meta
      property="og:image"
      content="https://btur99.github.io/snake-game/assets/snake.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="429" />
    <meta property="og:image:height" content="429" />
    <meta
      property="og:image:alt"
      content="Игровое поле змейки с мятным яблоком"
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Змейка — четыре режима" />
    <meta
      name="twitter:description"
      content="Минималистичная браузерная змейка: четыре режима, препятствия и рекорды. Играй без установки."
    />
    <meta
      name="twitter:image"
      content="https://btur99.github.io/snake-game/assets/snake.png"
    />
    <title>Змейка — четыре режима</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d1115'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%237ce8c1'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="index.css" />
    <script defer src="index.js"></script>
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="topbar-left">
          <h1 class="brand">Змейка</h1>
          <p class="mode-tag" data-mode-name>Средний</p>
        </div>
        <p class="meta">
          Рекорд <span class="dot" aria-hidden="true">·</span>
          <span class="meta-value" data-record>0</span>
        </p>
      </header>

      <section class="stage" aria-label="Игра «Змейка»">
        <canvas id="board" role="img" aria-label="Игровое поле змейки 21 на 21">
          Игровое поле змейки 21 на 21.
        </canvas>

        <div class="overlay" id="overlay" data-mode="start">
          <section
            class="screen"
            data-screen="start"
            aria-labelledby="startTitle"
          >
            <p class="kicker">21 × 21</p>
            <h2 class="screen-title" id="startTitle">Змейка</h2>
            <div
              class="modes"
              role="group"
              aria-label="Режим игры"
              data-mode-picker
            ></div>
            <button class="btn" type="button" data-action="start">
              Начать
            </button>
            <p class="hint">1–4 · Пробел · Enter · свайп</p>
          </section>

          <section
            class="screen"
            data-screen="pause"
            aria-labelledby="pauseTitle"
            hidden
          >
            <h2 class="screen-title screen-title--pause" id="pauseTitle">
              Пауза
            </h2>
            <button class="btn" type="button" data-action="resume">
              Продолжить
            </button>
            <button class="btn btn--ghost" type="button" data-action="menu">
              Сменить режим
            </button>
            <p class="hint">Пробел</p>
          </section>

          <section
            class="screen"
            data-screen="over"
            aria-labelledby="overTitle"
            hidden
          >
            <p class="kicker">Результат</p>
            <h2 class="screen-title screen-title--over" id="overTitle">
              Игра окончена
            </h2>
            <p class="final">
              <span class="sr-only">Счёт </span><span data-final-score>0</span>
            </p>
            <p class="record-line">Рекорд <span data-record>0</span></p>
            <button class="btn" type="button" data-action="restart">
              Ещё раз
            </button>
            <button class="btn btn--ghost" type="button" data-action="menu">
              Сменить режим
            </button>
            <p class="hint">Enter</p>
          </section>

          <section
            class="screen"
            data-screen="won"
            aria-labelledby="wonTitle"
            hidden
          >
            <p class="kicker">21 × 21</p>
            <h2 class="screen-title" id="wonTitle">Победа</h2>
            <p class="final">
              <span class="sr-only">Счёт </span><span data-final-score>0</span>
            </p>
            <p class="record-line">Рекорд <span data-record>0</span></p>
            <button class="btn" type="button" data-action="restart">
              Заново
            </button>
            <button class="btn btn--ghost" type="button" data-action="menu">
              Сменить режим
            </button>
            <p class="hint">Enter</p>
          </section>
        </div>
      </section>

      <div class="hud">
        <p class="meta">
          Счёт <span class="dot" aria-hidden="true">·</span>
          <span class="meta-value meta-value--score" data-score>0</span>
        </p>
        <button
          class="icon-btn"
          id="pauseButton"
          type="button"
          aria-label="Пауза"
          disabled
        >
          <svg
            class="icon icon-pause"
            viewBox="0 0 14 14"
            aria-hidden="true"
            focusable="false"
          >
            <rect x="3" y="2" width="2.4" height="10" rx="1.2" />
            <rect x="8.6" y="2" width="2.4" height="10" rx="1.2" />
          </svg>
          <svg
            class="icon icon-play"
            viewBox="0 0 14 14"
            aria-hidden="true"
            focusable="false"
          >
            <path d="M4.7 2.5 11.4 7l-6.7 4.5z" />
          </svg>
        </button>
      </div>
    </main>

    <p class="sr-only" id="status" aria-live="polite" aria-atomic="true"></p>
  </body>
</html>
